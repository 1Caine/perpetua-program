[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# solana-verify reads this to pick the verifiable build image.
[workspace.metadata.cli]
solana = "4.2.2"
