[package]
name = "perpetua"
version = "0.1.0"
description = "Perpetua: non-custodial onchain inheritance on Solana"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/1Caine/perpetua"

[lib]
crate-type = ["cdylib", "lib"]
name = "perpetua"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Devnet build: one "day" lasts one second so a full cycle can be watched end to end.
short-timers = []
devnet = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "token_2022", "associated_token"] }
solana-security-txt = "1.1.1"
